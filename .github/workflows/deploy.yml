name: Deploy to Reg.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch VK News
        run: npm run fetch-news
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}

      - name: Build
        run: npm run build

      # rsync вместо scp: передаёт ТОЛЬКО изменённые файлы (деплой — секунды, не минуты),
      # ничего не удаляет заранее — сайт не стоит полупустым во время заливки;
      # --delete подчищает на хостинге файлы, которых больше нет в dist
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 server66.hosting.reg.ru >> ~/.ssh/known_hosts

      - name: Deploy to hosting via rsync (only changed files)
        run: |
          rsync -az --checksum --delete \
            -e "ssh -p 22 -i ~/.ssh/deploy_key" \
            dist/ \
            "${{ secrets.HOSTING_USER }}@server66.hosting.reg.ru:/var/www/${{ secrets.HOSTING_USER }}/data/www/park-sever.ru/"
