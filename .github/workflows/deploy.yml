name: Deploy to Reg.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch VK News
        run: npm run fetch-news
        env:
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}

      - name: Build
        run: npm run build

      - name: Deploy to hosting via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: server66.hosting.reg.ru
          username: ${{ secrets.HOSTING_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/*"
          target: "/var/www/${{ secrets.HOSTING_USER }}/data/www/park-sever.ru"
          strip_components: 1
          overwrite: true
          rm: true
